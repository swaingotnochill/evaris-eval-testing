name: Eval smoke

# Runs a tiny real eval (two questions against the model API) under Inspect,
# then publishes the .eval artifact with the `evaris` CLI and a personal
# access token — the user flow a customer's CI runner takes.
on:
  workflow_dispatch:
  schedule:
    # Weekly smoke (Mondays 06:00 UTC) to keep the flow verified.
    - cron: "0 6 * * 1"

concurrency:
  group: eval-smoke
  cancel-in-progress: false

jobs:
  eval-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Inspect eval
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          INSPECT_EVAL_MODEL: ${{ vars.INSPECT_EVAL_MODEL || 'openai/glm-4.5' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.z.ai/api/paas/v4' }}
        run: |
          pip install -r requirements.txt
          bash scripts/run-eval.sh

      - name: Upload eval logs
        uses: actions/upload-artifact@v4
        with:
          name: eval-logs
          path: logs/

      - name: Publish to Evaris
        env:
          # Optional: override for a self-hosted deployment. The evaris CLI
          # defaults to the Evaris cloud API.
          EVARIS_API_URL: ${{ vars.EVARIS_API_URL }}
          EVARIS_API_TOKEN: ${{ secrets.EVARIS_API_TOKEN }}
          EVARIS_PROJECT_ID: ${{ vars.EVARIS_PROJECT_ID }}
        run: |
          if [[ -z "$EVARIS_API_TOKEN" || -z "$EVARIS_PROJECT_ID" ]]; then
            echo "Set var EVARIS_PROJECT_ID and secrets ZAI_API_KEY, EVARIS_API_TOKEN (see README)." >&2
            exit 1
          fi
          npx --yes evaris@latest publish logs/ --name "eval-smoke-${{ github.run_number }}"
